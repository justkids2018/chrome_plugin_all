<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Converter</title>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
    }
    
    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    h2 {
      margin: 0 0 15px 0;
      color: #333;
      font-size: 18px;
      font-weight: 600;
    }
    
    .option-group {
      margin-bottom: 15px;
    }
    
    .option-group label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-size: 14px;
      font-weight: 500;
    }
    
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .checkbox-wrapper input[type="checkbox"] {
      margin-right: 8px;
    }
    
    .checkbox-wrapper label {
      margin: 0;
      font-weight: normal;
    }
    
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #0056b3;
    }
    
    button:active {
      background: #004085;
    }
    
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .secondary-button {
      background: #6c757d;
      margin-top: 8px;
    }
    
    .secondary-button:hover {
      background: #5a6268;
    }
    
    .notebooklm-button {
      background: #4285f4;
      color: white;
      margin-top: 8px;
    }
    
    .notebooklm-button:hover {
      background: #3367d6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📝 Web to Markdown</h2>
    
    <div class="option-group">
      <label>Conversion Options:</label>
      <div class="checkbox-wrapper">
        <input type="checkbox" id="includeTitle" checked>
        <label for="includeTitle">Include page title</label>
      </div>
      <div class="checkbox-wrapper">
        <input type="checkbox" id="includeUrl" checked>
        <label for="includeUrl">Include page URL</label>
      </div>
      <div class="checkbox-wrapper">
        <input type="checkbox" id="includeMeta" checked>
        <label for="includeMeta">Include metadata</label>
      </div>
      <div class="checkbox-wrapper">
        <input type="checkbox" id="filterAds">
        <label for="filterAds">Filter ads and navigation</label>
      </div>
    </div>
    
    <div class="option-group">
      <label for="contentSelector">Content Selector (CSS):</label>
      <input type="text" id="contentSelector" placeholder="e.g., article, .main-content" 
             style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
    </div>
    
    <button id="convertBtn">Convert to Markdown</button>
    <button class="secondary-button" id="copyBtn">Copy to Clipboard</button>
    <button class="secondary-button" id="downloadBtn">Download as .md</button>
    <button class="notebooklm-button" id="notebookLMBtn">📚 Open in NotebookLM</button>
    
    <div id="status" class="status"></div>
    
    <textarea id="markdownOutput" style="width: 100%; height: 200px; margin-top: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 12px; display: none;" readonly></textarea>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
